[project]
name = "mainlogic"
version = "0.1.0"
description = "MainLogic: do long-context language models reason from what they read?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=14.0.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false
